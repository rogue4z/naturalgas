name: Update Natural Gas Data

on:
  schedule:
    - cron: "30 15 * * 4"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download EIA storage data
        run: |
          curl -L "https://ir.eia.gov/ngs/wngsr.csv" -o eia_storage.csv

      - name: Convert EIA data to dashboard JSON
        run: |
          python <<'PY'
          import csv
          import json

          with open("eia_storage.csv", "r", encoding="utf-8-sig") as f:
              rows = list(csv.reader(f))

          total_row = None

          for row in rows:
              if row and row[0].strip() == "Total":
                  total_row = row
                  break

          if total_row is None:
              raise Exception("Could not find Total row")

          current = int(total_row[1].replace(",", ""))
          previous = int(total_row[4].replace(",", ""))
          weekly_change = int(total_row[7].replace(",", ""))
          year_ago = int(total_row[13].replace(",", ""))
          five_year_average = int(total_row[17].replace(",", ""))

          data = {
              "storage": {
                  "current": current,
                  "previous": previous,
                  "weeklyChange": weekly_change,
                  "yearAgo": year_ago,
                  "fiveYearAverage": five_year_average
              }
          }

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=4)

          print(json.dumps(data, indent=4))
          PY

      - name: Remove temporary CSV
        run: |
          rm eia_storage.csv

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          git diff --cached --quiet || git commit -m "Update natural gas storage data"

          git push